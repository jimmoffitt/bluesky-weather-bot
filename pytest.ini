[pytest]
testpaths = tests
addopts = -m "not live"
markers =
    integration: hits live external APIs (Open-Meteo). No Bluesky credentials needed.
    live: sends real Bluesky posts/DMs. Requires BSKY_HANDLE + BSKY_APP_PASSWORD in .local.env. Excluded by default (see addopts) — opt in with `-m live`.
